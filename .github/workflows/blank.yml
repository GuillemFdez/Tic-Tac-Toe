name: Android CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codi
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Permisos per a gradlew
        run: chmod +x gradlew

      - name: Missatge inicial
        run: echo "Iniciant el procés de Build i Test..."

      - name: Build amb Gradle
        run: ./gradlew assembleDebug

      - name: Executar Unit Tests
        run: ./gradlew test

      - name: Missatge final
        run: echo "Pipeline finalitzat amb èxit!"
